<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgenteCore AWS — Chat com IA</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            background: #f0f2f5;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }
        #chat-container {
            width: 100%;
            max-width: 560px;
            margin: 24px auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
        }
        #chat-title { text-align: center; font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
        #chat-subtitle { text-align: center; color: #6b7280; font-size: .9rem; margin-bottom: 18px; }
        #chat-messages {
            height: 360px;
            overflow-y: auto;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            background: #fafafa;
        }
        .message { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 12px; line-height: 1.45; }
        .message strong { color: #111827; }
        #chat-form { display: flex; gap: 8px; }
        #chat-input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }
        #send-button {
            padding: 12px 18px;
            border: none;
            background: #146eb4;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        #send-button:disabled { opacity: .6; cursor: wait; }
        #status { min-height: 1.2em; margin-top: 10px; color: #6b7280; font-size: .85rem; }
        @media (max-width: 480px) {
            body { padding: 8px; }
            #chat-container { margin: 8px auto; padding: 14px; }
            #chat-form { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main id="chat-container">
        <div id="chat-title">Integração de chat AgenteCore AWS</div>
        <div id="chat-subtitle">Assistente de IA com Amazon Bedrock</div>
        <div id="chat-messages" role="log" aria-live="polite" aria-label="Mensagens da conversa"></div>
        <form id="chat-form">
            <input type="text" id="chat-input" name="message" maxlength="4000"
                   placeholder="Digite sua mensagem..." autocomplete="off" required>
            <button type="submit" id="send-button">Enviar</button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="app.js"></script>
</body>
</html>
